apply plugin: 'com.android.application'

android {
    namespace 'node.nveloper.fetcher'
    compileSdk 35

    defaultConfig {
        applicationId 'node.nveloper.fetcher'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
